<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 아이패드 전체화면(홈 화면에 추가) 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Conway's Game of Life</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: black; overflow: hidden; height: 100%; touch-action: none; }
        canvas { display: block; }
        #hud { 
            position: absolute; top: 20px; left: 20px; 
            color: rgba(255, 255, 255, 0.8); font-family: monospace; font-size: 14px; 
            pointer-events: none; text-shadow: 2px 2px 4px black; 
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>ALGORITHM: Moore Neighborhood (B3/S23)</div>
        <div id="hexDump">INIT SEQUENCE...</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hudText = document.getElementById('hexDump');

        const cellSize = 20; // 픽셀 크기를 14px에서 20px로 확대
        let cols, rows;
        let grid = [];
        let nextGrid = [];

        // 텍스트를 초기 씨앗 데이터(이진수)로 변환
        const seedText = "콘웨이의 생명 게임...";
        let hexString = Array.from(new TextEncoder().encode(seedText))
                        .map(b => b.toString(16).padStart(2, '0')).join('');
        
        function init() {
            cols = Math.ceil(window.innerWidth / cellSize);
            rows = Math.ceil(window.innerHeight / cellSize);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            grid = new Array(cols).fill(null).map(() => new Array(rows).fill(0));
            nextGrid = new Array(cols).fill(null).map(() => new Array(rows).fill(0));

            const startCol = Math.floor(cols / 2) - 10;
            const startRow = Math.floor(rows / 2) - 10;
            
            for(let i=0; i<hexString.length; i++) {
                const bin = parseInt(hexString[i], 16).toString(2).padStart(4, '0');
                for(let j=0; j<4; j++) {
                    const c = startCol + (i % 20);
                    const r = startRow + Math.floor(i / 20) * 4 + j;
                    if(c >= 0 && c < cols && r >= 0 && r < rows) grid[c][r] = parseInt(bin[j]);
                }
            }
        }

        function drawGrid() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    if (grid[i][j] === 1) {
                        ctx.fillRect(i * cellSize, j * cellSize, cellSize - 1, cellSize - 1);
                    }
                }
            }
        }

        function updateGrid() {
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    let neighbors = countNeighbors(i, j);
                    if (grid[i][j] === 1 && (neighbors === 2 || neighbors === 3)) nextGrid[i][j] = 1;
                    else if (grid[i][j] === 0 && neighbors === 3) nextGrid[i][j] = 1;
                    else nextGrid[i][j] = 0;
                }
            }
            let temp = grid;
            grid = nextGrid;
            nextGrid = temp;
            
            // HUD 텍스트 깜빡임 효과
            hudText.innerText = "STREAM: " + hexString.substring(Math.floor(Math.random()*30), 50) + "...";
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i < 2; i++) {
                for (let j = -1; j < 2; j++) {
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[col][row];
                }
            }
            sum -= grid[x][y];
            return sum;
        }

        // 자연스러운 개입: 화면 가장자리에서 '글라이더' 패턴 스폰
        function spawnGlider() {
            const glider = [
                [0, 1, 0],
                [0, 0, 1],
                [1, 1, 1]
            ];
            const x = Math.floor(Math.random() * (cols - 10)) + 2;
            const y = Math.floor(Math.random() * (rows - 10)) + 2;
            
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                     if(x+i < cols && y+j < rows) grid[x+i][y+j] = glider[j][i];
                }
            }
        }

        // 8초마다 글라이더를 한 대씩 떨어뜨려 정체된 생태계 교란
        setInterval(spawnGlider, 8000);

        // 연산 속도(FPS) 제한 로직 (너무 빠르지 않게 1초에 15세대만 연산)
        let lastTime = 0;
        const fps = 15; 
        const interval = 1000 / fps;

        function loop(time) {
            requestAnimationFrame(loop);
            const deltaTime = time - lastTime;
            
            if (deltaTime > interval) {
                lastTime = time - (deltaTime % interval);
                updateGrid();
                drawGrid();
            }
        }

        // 관객 상호작용 (터치로 세포 생성)
        let isDrawing = false;
        function addCells(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            const col = Math.floor((x - rect.left) / cellSize);
            const row = Math.floor((y - rect.top) / cellSize);
            
            for(let i = -1; i <= 1; i++) {
                for(let j = -1; j <= 1; j++) {
                    if(Math.random() > 0.4) { // 브러쉬 밀도 조정
                        let c = (col + i + cols) % cols;
                        let r = (row + j + rows) % rows;
                        grid[c][r] = 1;
                    }
                }
            }
        }

        window.addEventListener('resize', init);
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; addCells(e); });
        canvas.addEventListener('mousemove', (e) => { if(isDrawing) addCells(e); });
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; addCells(e); });
        canvas.addEventListener('touchmove', (e) => { if(isDrawing) addCells(e); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', () => isDrawing = false);

        init();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
