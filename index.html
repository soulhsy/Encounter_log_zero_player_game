<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 아이패드 사파리 전체화면(웹 앱) 모드 지원 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Conway's Game of Life - Text to Algorithm</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            font-family: "Courier New", Courier, monospace;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none; /* 클릭 방해 방지 */
            font-size: 16px;
            line-height: 1.8;
            color: #fff; /* 터미널 느낌의 초록색(Green) 폰트로 변경 */
            /* 픽셀이 아래로 지나가도 글씨가 잘 보이도록 강한 검은 테두리 추가 */
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
        }

        .hud-item {
            margin-bottom: 5px;
        }

        .math-symbol {
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-item" id="gen-counter">t = 0</div>
        <div class="hud-item">Rule: B3/S23</div>
        <div class="hud-item" id="seed-hex">SEED: </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // 1. 초기 씨앗이 될 원본 텍스트
        const sourceText = "콘웨이의 생명 게임 (Conway's Game of Life) 1970년 수학자 존 콘웨이가 고안한 세포 자동자(Cellular Automaton) 시뮬레이션입니다. 바둑판같은 격자 위에 검은색(생존)과 흰색(죽음) 세포들이 놓여 있습니다. 플레이어는 처음에 몇 개의 세포를 어디에 찍을지(초기값)만 결정합니다. 이후에는 '주변에 세포가 너무 많으면 굶어 죽고, 적당하면 번식한다'는 단 4줄의 맹목적인 수학적 규칙(알고리즘)에 따라 세포들이 스스로 패턴을 만들며 무한히 증식하고 소멸합니다. 인간의 미세한 초기 의도가 기계적 연산을 거쳐 복잡하고 기괴한 디지털 생명체의 박동으로 진화하는 것을 지켜보는 고전적인 매체입니다.";

        // 2. 텍스트를 UTF-8 인코딩 후 이진수(Binary)와 16진수(Hex) 문자열로 변환
        const encoder = new TextEncoder();
        const uint8array = encoder.encode(sourceText);
        
        let binaryString = "";
        let hexString = "";
        
        for (let i = 0; i < uint8array.length; i++) {
            // 이진수 변환 (8자리 고정)
            binaryString += uint8array[i].toString(2).padStart(8, '0');
            // HUD에 표시할 16진수 덤프 (앞부분 12바이트만 추출)
            if (i < 12) {
                hexString += uint8array[i].toString(16).toUpperCase().padStart(2, '0') + " ";
            }
        }
        
        document.getElementById('seed-hex').innerText = `SEED: ${hexString}...`;

        // 3. 캔버스 및 그리드 설정
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // 성능 최적화를 위해 alpha 비활성화
        
        const cellSize = 14; // 픽셀 크기를 14px로 증가 (더 굵직하고 확실한 움직임)
        let cols, rows;
        let grid = [];
        let nextGrid = [];
        let generation = 0;

        // 화면 크기에 맞춰 그리드 초기화
        function initGrid() {
            // 브라우저 렌더링 지연으로 0이 반환될 때를 대비해 기본값(300) 지정
            canvas.width = window.innerWidth || 300;
            canvas.height = window.innerHeight || 300;
            
            // 모듈러 연산 시 NaN 에러 방지를 위해 최소값(1) 강제 지정
            cols = Math.max(1, Math.floor(canvas.width / cellSize));
            rows = Math.max(1, Math.floor(canvas.height / cellSize));
            
            grid = new Array(cols).fill(null).map(() => new Array(rows).fill(0));
            nextGrid = new Array(cols).fill(null).map(() => new Array(rows).fill(0));
            generation = 0;

            // 커진 픽셀 크기에 맞춰 텍스트 씨앗이 화면 안에 들어가도록 너비 자동 조절
            const seedWidth = Math.max(10, cols - 4);
            const seedHeight = Math.ceil(binaryString.length / seedWidth);
            
            const startX = Math.floor((cols - seedWidth) / 2);
            const startY = Math.floor((rows - seedHeight) / 2);

            let charIndex = 0;
            for (let y = 0; y < seedHeight; y++) {
                for (let x = 0; x < seedWidth; x++) {
                    if (charIndex < binaryString.length) {
                        const cellState = parseInt(binaryString[charIndex]);
                        // 화면 바깥으로 나가지 않도록 경계 검사
                        if (startX + x >= 0 && startX + x < cols && startY + y >= 0 && startY + y < rows) {
                            grid[startX + x][startY + y] = cellState;
                        }
                        charIndex++;
                    }
                }
            }
        }

        // 4. Conway's Game of Life 메인 로직 (전이 함수)
        function calculateNextGeneration() {
            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < rows; y++) {
                    let state = grid[x][y];
                    
                    // 무어 이웃(Moore neighborhood) 합산
                    let neighbors = 0;
                    for (let i = -1; i < 2; i++) {
                        for (let j = -1; j < 2; j++) {
                            if (i === 0 && j === 0) continue;
                            
                            // 토러스(Torus) 형태의 맵 래핑 (가장자리 연결)
                            let col = (x + i + cols) % cols;
                            let row = (y + j + rows) % rows;
                            
                            neighbors += grid[col][row];
                        }
                    }

                    // 세포 상태 업데이트 규칙
                    if (state === 0 && neighbors === 3) {
                        nextGrid[x][y] = 1; // 번식
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[x][y] = 0; // 과밀 혹은 고립으로 사망
                    } else {
                        nextGrid[x][y] = state; // 유지
                    }
                }
            }

            // 배열 참조 교환 (메모리 재할당 방지)
            let temp = grid;
            grid = nextGrid;
            nextGrid = temp;
        }

        // 5. 그리기 로직
        function drawGrid() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF'; // 색상을 다시 하얀색으로 변경
            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < rows; y++) {
                    if (grid[x][y] === 1) {
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }
            }
        }

        // --- 추가된 상호작용(터치/마우스) 및 생태계 유지(Entropy) 로직 ---

        let isDrawing = false;

        // 특정 좌표에 생명체 군집(블록) 생성 (드래그 시 붓펜 효과)
        function spawnCellsAt(clientX, clientY) {
            if (!cols || !rows || cols === 0 || rows === 0) return; // 에러 방지

            const gridX = Math.floor(clientX / cellSize);
            const gridY = Math.floor(clientY / cellSize);
            
            // 터치한 위치 주변 3x3 영역에 확률적으로 세포 생성
            for(let i = -1; i <= 1; i++) {
                for(let j = -1; j <= 1; j++) {
                    if (Math.random() > 0.3) {
                        const targetX = (gridX + i + cols) % cols;
                        const targetY = (gridY + j + rows) % rows;
                        grid[targetX][targetY] = 1;
                    }
                }
            }
        }

        // PC 마우스 지원
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; spawnCellsAt(e.clientX, e.clientY); });
        canvas.addEventListener('mousemove', (e) => { if(isDrawing) spawnCellsAt(e.clientX, e.clientY); });
        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        // 아이패드 터치 지원 (스크롤 방지 포함)
        canvas.addEventListener('touchstart', (e) => { 
            isDrawing = true; 
            e.preventDefault(); 
            for(let i = 0; i < e.touches.length; i++) spawnCellsAt(e.touches[i].clientX, e.touches[i].clientY);
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { 
            if(isDrawing) {
                e.preventDefault();
                for(let i = 0; i < e.touches.length; i++) spawnCellsAt(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, {passive: false});
        canvas.addEventListener('touchend', () => { isDrawing = false; });

        // 정체 방지(Entropy) 로직: 4초마다 화면 가장자리에 자연스러운 글라이더(우주선) 주입
        let lastEntropyTime = 0;
        function injectGlider(timestamp) {
            if (timestamp - lastEntropyTime > 4000) {
                lastEntropyTime = timestamp;
                
                // 대각선으로 영원히 이동하는 글라이더 패턴 정의 (3x3 그리드 기준 좌표)
                // SE(우하단), SW(좌하단), NE(우상단), NW(좌상단) 방향
                const gliderSE = [[1,0], [2,1], [0,2], [1,2], [2,2]];
                const gliderSW = [[1,0], [0,1], [0,2], [1,2], [2,2]];
                const gliderNE = [[0,0], [1,0], [2,0], [2,1], [1,2]];
                const gliderNW = [[0,0], [1,0], [2,0], [0,1], [1,2]];

                let edge = Math.floor(Math.random() * 4); // 0: 상, 1: 우, 2: 하, 3: 좌
                let startX, startY;
                let pattern;

                if (edge === 0) { // 화면 위쪽 모서리 (아래로 이동)
                    startX = Math.floor(Math.random() * (cols - 10)) + 5;
                    startY = 0;
                    pattern = Math.random() > 0.5 ? gliderSE : gliderSW;
                } else if (edge === 1) { // 화면 오른쪽 모서리 (왼쪽으로 이동)
                    startX = cols - 3;
                    startY = Math.floor(Math.random() * (rows - 10)) + 5;
                    pattern = Math.random() > 0.5 ? gliderNW : gliderSW;
                } else if (edge === 2) { // 화면 아래쪽 모서리 (위로 이동)
                    startX = Math.floor(Math.random() * (cols - 10)) + 5;
                    startY = rows - 3;
                    pattern = Math.random() > 0.5 ? gliderNE : gliderNW;
                } else { // 화면 왼쪽 모서리 (오른쪽으로 이동)
                    startX = 0;
                    startY = Math.floor(Math.random() * (rows - 10)) + 5;
                    pattern = Math.random() > 0.5 ? gliderNE : gliderSE;
                }

                // 결정된 위치와 패턴에 따라 그리드에 세포 활성화
                for (let i = 0; i < pattern.length; i++) {
                    let tx = (startX + pattern[i][0] + cols) % cols;
                    let ty = (startY + pattern[i][1] + rows) % rows;
                    grid[tx][ty] = 1;
                }
            }
        }

        // 6. 애니메이션 루프 (FPS 제어)
        let lastTime = 0;
        const fps = 8; // 속도를 8 FPS로 늦춰 변화를 더 자연스럽게 관찰 가능하도록 변경
        const interval = 1000 / fps;

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);

            // 매 프레임마다 정체 방지(글라이더 주입) 로직 확인
            injectGlider(timestamp);

            if (timestamp - lastTime >= interval) {
                lastTime = timestamp;
                
                calculateNextGeneration();
                drawGrid();
                
                generation++;
                document.getElementById('gen-counter').innerText = `t = ${generation}`;
            }
        }

        // 윈도우 리사이즈 시 그리드 재설정 (전시 상황 대응)
        window.addEventListener('resize', () => {
            initGrid();
            drawGrid();
        });

        // 초기화 및 루프 시작
        window.onload = () => {
            initGrid();
            drawGrid();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
